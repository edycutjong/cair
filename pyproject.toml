# Tooling configuration only — Cair is an application, not a published package (dependencies: requirements.txt).

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["evidence", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # prose strings and rule-sheet quotes are intentionally long; the formatter is not enforced
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"scripts/*" = ["E402"]  # scripts put the repo root on sys.path before importing cair

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["^\\.venv/", "^evidence/", "^e2e/"]

[tool.coverage.run]
source = ["cair"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
